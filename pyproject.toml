[project]
name = "candycaption"
version = "0.1.0"
description = "Caption a LoRA dataset one image at a time through any OpenAI-compatible model server, then review the captions most likely to be wrong"
authors = [{name = "CountCandy"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    # Pixel measurements for the Flavor Profile (style) tab.
    "numpy>=1.26",
    # Token counter: the Qwen tokenizer file is read with `tokenizers`; the
    # first-run download uses huggingface-hub. Both are small, no PyTorch.
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.24.0",
    # Label Maker: runs the image tagger (an ONNX file) inside the app. No PyTorch.
    # On Windows and Linux this is the NVIDIA build, with the CUDA libraries it needs installed beside it,
    # so the tagger uses the graphics card. Without a usable card it falls back to the CPU by itself.
    "onnxruntime-gpu[cuda,cudnn]>=1.21; sys_platform == 'win32' or sys_platform == 'linux'",
    "onnxruntime>=1.18; sys_platform != 'win32' and sys_platform != 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    # Builds a toy tagger model for the tests, so the real loading and scoring code runs.
    "onnx>=1.16",
]

[project.scripts]
candycaption = "candycaption.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candycaption"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.uv]
# The lock file must hold builds that install on these, or the NVIDIA libraries could be pinned to a
# release that exists for Linux only and `uv sync` would fail on Windows.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# These two releases were published for Linux only. Windows takes the release before them.
constraint-dependencies = [
    "nvidia-cublas<13.10.1; sys_platform == 'win32'",
    "nvidia-cublas-cu12<12.9.3; sys_platform == 'win32'",
]
