[project]
name = "candycaption"
version = "0.1.0"
description = "Caption a LoRA dataset one image at a time through any OpenAI-compatible model server, then review the captions most likely to be wrong"
authors = [{name = "CountCandy"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    # Pixel measurements for the Flavor Profile (style) tab.
    "numpy>=1.26",
    # Token counter: the Qwen tokenizer file is read with `tokenizers`; the
    # first-run download uses huggingface-hub. Both are small, no PyTorch.
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
candycaption = "candycaption.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candycaption"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
pythonpath = ["src"]
